id: common-integration-spec
title: Integration spec (no Portal FE)
summary: Webhook, partner API, public API — contract không có Portal *.spec.yaml. Dùng alias ngắn trong prompt khi tên command đầy đủ quá dài.

commands:
  contract:
    command: /api-integration-spec
    alias: /api-int-spec
    skill: .cursor/skills/api-integration-spec/SKILL.md
    step: 1 — viết 01-backend-spec.yaml
  audit:
    command: /grill-integration-spec
    alias: /grill-int-spec
    skill: .cursor/skills/grill-integration-spec/SKILL.md
    step: 1b — audit + codegen gates
  implement:
    command: /api-code
    step: 2 — Laravel sau approval

flow: /api-int-spec → /grill-int-spec → /api-code

whenToUse:
  - Webhook inbound (Stripe, OTA, …)
  - Webhook outbound (notify partner)
  - Partner / public REST API cho bên thứ 3
  - Không có Portal FE spec hay testcase YAML

whenNotToUse:
  - API nội bộ có Portal UI → /api-spec
  - Portal sync sau khi đã có contract → /api-update-spec

sourceShape:
  feature.source.base: none
  refs: integrationRefs[] thay portalRefs[]
  backlog: integrationBacklog[] thay pendingTechDebt[]
  layout: contexts.portalLayout none

paths:
  template: docs/templates/backend-api-integration.yaml
  extract: .cursor/extracts/api-integration-spec.md
  guide: docs/operational/BACKEND_API_SPEC_GUIDE.md#0b-integration--partner--webhook-không-portal-fe
  operational: docs/operational/INTEGRATION-API-SPEC.md

promptExample: |
  /api-int-spec integrations/stripe/charge
  /grill-int-spec integrations/stripe/charge
  /api-code integrations/stripe/charge

notes:
  - Alias /api-int-spec và /grill-int-spec là tên ngắn trong docs — skill file vẫn là api-integration-spec.
  - Không nằm diagram Portal FE trong Team AI Backend Workflow.
