approval:
  status: approved
  reviewedBy: grill-api-spec
  reviewedAt: 2026-06-27
  approvedBy: api-code
  approvedAt: 2026-06-27
  notes: api:gen:dry passed; openQuestions OQ-001..004 accepted for list-only pilot. Export/login-as deferred.
changeLog:
  - id: CHG-CHAIN-HOTEL-001
    source: portal-spec
    summary: Initial backend contract for chain hotel list (GET /hotels).
    impact:
      - Add Chain module list endpoint for hotels scoped by session chain_id.
      - Add ChainHotelResource with nested managers for handoff column.
    breaking: false
  - id: CHG-CHAIN-HOTEL-002
    source: grill-api-spec
    summary: Add codegen block,
    impact:
      - codegen profile crud-standard for new Chain module.
      - HANDOFF items for chain scope, managers relationship, default per_page 100.
    breaking: false
decisions:
  - id: DEC-CHAIN-HOTEL-001
    summary: List-only scope for this pass; export-report and login-as-manager are separate portal specs.
    reason: Portal notes defer export/login-as detail to chain-hotel-export-report and chain-hotel-login-as-manager.
  - id: DEC-CHAIN-HOTEL-002
    summary: No search filters on list contract despite legacy paginateHotels supporting name/to_created.
    reason: UI parity — chain/hotel blade has no search form; portal testcase asserts search form hidden.
  - id: DEC-CHAIN-HOTEL-003
    summary: Default sort created_at desc with tie-break id desc.
    reason: REQ-CHAIN-HOTEL-LIST-001 and legacy ChainService::paginateHotels behavior.
  - id: DEC-CHAIN-HOTEL-004
    summary: Response envelope follows ApiResponse + EntrySearchTrait (data array + meta.pagination).
    reason: API base standard; portal prototype schema uses items/total — align on /wire.
  - id: DEC-CHAIN-HOTEL-005
    summary: Codegen creates Chain module + Hotel Platform shared model with wire-search only.
    reason: New module in api workspace; no detail/create/update/delete for chain list parity.
tags:
  - "#gen:module"
  - "#gen:model-platform"
  - "#gen:crud"
  - "#gen:test-module"
  - "#manual-action:relationships"
  - "#manual-action:chain-scope"
  - "#manual-action:default-per-page"
  - "#manual-action:nested-managers-resource"
codegen:
  module: Chain
  entity: Hotel
  pathModel: Platform
  sharedModel: true
  profile: crud-standard
  wire:
    search: true
    detail: false
    create: false
    update: false
    delete: false
    bulk-delete: false
    selectItems: false
  skip: []
  commands: []
contexts:
  portalLayout: single-portal
  routePrefixes:
    chain: /chain
  actors:
    - chain
modules:
  - name: Chain
    purpose: Chain-portal APIs for hotels owned by the authenticated chain.
    entities:
      - name: Hotel
        table: hotels
        mode: Platform
        aggregateRoot: false
        scope:
          bySession: chain_id
        fields:
          - name: id
            type: integer
            readOnly: true
          - name: name
            type: string
            nullable: true
          - name: chain_id
            type: integer
            readOnly: true
        relationships:
          - name: chain
            type: belongsTo
            target: Chain
            foreignKey: chain_id
          - name: managers
            type: hasMany
            target: User
            purpose: Store managers for login-as handoff pills on list rows.
requirements:
  covered:
    - REQ-CHAIN-HOTEL-LIST-001
    - REQ-CHAIN-HOTEL-LIST-002
    - REQ-CHAIN-HOTEL-LIST-003
pendingTechDebt:
  - id: TD-CHAIN-HOTEL-EXPORT
    status: pending
    source: portal
    portalRef: chain-hotel-export-report
    portalRequirementIds:
      - REQ-CHAIN-HOTEL-LIST-004
      - REQ-CHAIN-HOTEL-EXPORT-001
      - REQ-CHAIN-HOTEL-EXPORT-002
    summary: POST /hotels/export-report — xlsx 開封率月次報告 (TrackerService parity).
    expectedWhenDone:
      endpointIds:
        - chain-hotel.export-report
      tags:
        - "#manual-service:export-open-rate-report"
      action: custom
    notes: UI embed on list page; merge via /api-update-spec chain/hotel.
  - id: TD-CHAIN-HOTEL-LOGIN-AS
    status: pending
    source: portal
    portalRef: chain-hotel-login-as-manager
    portalRequirementIds: []
    summary: Login-as store manager handoff from list row — custom auth/token flow.
    expectedWhenDone:
      endpointIds:
        - chain-hotel.login-as-manager
      tags:
        - "#manual-action:chain-scope"
        - "#manual-action:login-as-handoff"
      action: custom
    notes: Portal
beOnlyRequirements: []
api:
  endpoints:
    - id: chain-hotel.search
      module: Chain
      action: search
      method: GET
      path: /hotels
      purpose: Paginated list of hotels belonging to the authenticated chain.
      reusedBy:
        - /hotels
      legacyPath: /chain/hotel
      auth:
        required: true
        actor: chain
        scope: chain_id from session
      query:
        pagination: true
        perPageDefault: 100
        perPageMax: 100
        perPageOptions:
          - 20
          - 40
          - 80
          - 100
        filters: []
        sorts:
          - created_at
          - id
        sortDefault:
          order_by: created_at
          sorted_by: desc
          tieBreak:
            order_by: id
            sorted_by: desc
      request: ChainHotelSearchRequest
      response: ChainHotelCollection
      tags: []
      externalCallRefs: []
      serviceRefs: []
externalCalls: []
services: []
requests:
  ChainHotelSearchRequest:
    extends: SearchRequest
    fields:
      - name: page
        type: integer
        rules:
          - nullable
          - integer
          - min:1
      - name: per_page
        type: integer
        rules:
          - nullable
          - integer
          - min:1
          - max:100
      - name: order_by
        type: string
        rules:
          - nullable
          - string
          - in:created_at,id
      - name: sorted_by
        type: string
        rules:
          - nullable
          - string
          - in:asc,desc,ASC,DESC
responses:
  ChainHotelManagerResource:
    fields:
      - name: id
        type: integer
      - name: full_name
        type: string
        nullable: true
  ChainHotelResource:
    fields:
      - name: id
        type: integer
      - name: name
        type: string
        nullable: true
      - name: managers
        type: array
        items: ChainHotelManagerResource
  ChainHotelCollection:
    envelope: ApiResponse
    data: array of ChainHotelResource
    meta:
      pagination:
        - current_page
        - per_page
        - last_page
        - total
openQuestions:
  - id: OQ-CHAIN-HOTEL-001
    question: Chain module and route group do not exist in api workspace yet — confirm API prefix (testcase mocks GET /api/hotels).
    tag: phase-api
  - id: OQ-CHAIN-HOTEL-002
    question: Portal FE ChainHotelListResponseSchema uses items/total; backend uses data + meta.pagination — resolve on /wire.
    tag: wire
  - id: OQ-CHAIN-HOTEL-003
    question: Confirm managers relationship (legacy pivot/table name) for eager-load on list query.
    tag: legacy
  - id: OQ-CHAIN-HOTEL-004
    question: REQ-002 hides managers with full_name case-insensitive "mairy" — implement in FE render only or exclude in API?
    tag: product
